name: mvvm_flutter_boilerplate
description: MVVM Flutter boilerplate with login (ReqRes) - Material 3 modern UI
publish_to: "none"
version: 0.0.1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.4.2+1
  get_it: ^9.0.5
  shared_preferences: ^2.3.0
  drift: ^2.20.0
  path_provider: ^2.1.2
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.24
  intl: ^0.20.2
  fl_chart: ^0.70.0
  flutter_launcher_icons: ^0.13.1
  rename_app: ^1.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

flutter_launcher_name:
  name: "Jurnal Sular"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"